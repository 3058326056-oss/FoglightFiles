<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830">
  <rect x="0" y="0" width="1200" height="830" fill="#FAF8F4"/>
  <text x="40" y="42" font-family="PingFang SC, sans-serif" font-size="24" font-weight="bold" fill="#2F3E4E">图2.1 《雾灯档案》系统架构图</text>
  <text x="40" y="70" font-family="PingFang SC, sans-serif" font-size="14" fill="#7A7A72">MVVM 分层 · 独立完成：图中每个模块均由本人设计、编码、集成与测试，无组队分工</text>

  <rect x="40" y="92" width="1120" height="158" rx="12" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
  <text x="60" y="120" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#0C447C">表示层 M6 · ArkUI 页面与组件（状态管理 V1）</text>
  <rect x="894" y="102" width="246" height="24" rx="6" fill="#B4782D"/>
  <text x="1017" y="119" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#FFFFFF">本层全部由本人负责</text>

  <g font-family="PingFang SC, sans-serif">
    <rect x="60" y="134" width="208" height="46" rx="8" fill="#FFFFFF" stroke="#B5D4F4"/>

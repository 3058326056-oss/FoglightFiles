    <text x="600" y="154" text-anchor="middle" font-size="13" fill="#0C447C">ExploreView 探索</text>
    <text x="600" y="172" text-anchor="middle" font-size="10" fill="#B4782D">本人负责 · 分支交互</text>

    <rect x="714" y="134" width="208" height="46" rx="8" fill="#FFFFFF" stroke="#B5D4F4"/>
    <text x="818" y="154" text-anchor="middle" font-size="13" fill="#0C447C">ClueBoardView 线索板</text>

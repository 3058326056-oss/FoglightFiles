    <text x="964" y="333" text-anchor="middle" font-size="13" fill="#085041">UiBus（AppStorage 广播）</text>
    <text x="964" y="349" text-anchor="middle" font-size="10" fill="#B4782D">本人负责 · 状态版本通知</text>
  </g>

  <path d="M600 368 L600 391" stroke="#7A7A72" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="612" y="384" font-family="PingFang SC, sans-serif" font-size="11" fill="#7A7A72">evaluate / applyChoice（内存对象）</text>

  <rect x="40" y="394" width="1120" height="108" rx="12" fill="#EEEDFE" stroke="#CECBF6" stroke-width="1"/>
  <text x="60" y="422" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#3C3489">纯业务逻辑层 M1 / M2 · 零 @ohos.* 依赖（可脱离设备单测）</text>
  <rect x="894" y="404" width="246" height="24" rx="6" fill="#B4782D"/>
  <text x="1017" y="421" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#FFFFFF">本层全部由本人负责</text>
  <g font-family="PingFang SC, sans-serif">
    <rect x="60" y="436" width="352" height="52" rx="8" fill="#FFFFFF" stroke="#CECBF6"/>
    <text x="236" y="456" text-anchor="middle" font-size="13" fill="#3C3489">CaseEngine（纯函数）</text>
    <text x="236" y="474" text-anchor="middle" font-size="10" fill="#534AB7">门槛 / effects / 推理验证 / 结局优先级</text>
    <rect x="424" y="436" width="352" height="52" rx="8" fill="#FFFFFF" stroke="#CECBF6"/>
    <text x="600" y="456" text-anchor="middle" font-size="13" fill="#3C3489">Models（类型与白名单校验）</text>
    <text x="600" y="474" text-anchor="middle" font-size="10" fill="#534AB7">GameState / sanitizeGameState / 深拷贝</text>
    <rect x="788" y="436" width="352" height="52" rx="8" fill="#FFFFFF" stroke="#CECBF6"/>
    <text x="964" y="456" text-anchor="middle" font-size="13" fill="#3C3489">CaseCatalog（本地案件常量）</text>
    <text x="964" y="474" text-anchor="middle" font-size="10" fill="#534AB7">3 场景 / 14 事件 / 9 线索 / 4 结局</text>
  </g>

  <path d="M600 502 L600 525" stroke="#7A7A72" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="612" y="518" font-family="PingFang SC, sans-serif" font-size="11" fill="#7A7A72">save(GameState) / load()</text>

  <rect x="40" y="528" width="1120" height="108" rx="12" fill="#FAEEDA" stroke="#FAC775" stroke-width="1"/>

  <rect x="894" y="538" width="246" height="24" rx="6" fill="#B4782D"/>
  <text x="1017" y="555" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#FFFFFF">本层全部由本人负责</text>
  <g font-family="PingFang SC, sans-serif">
    <rect x="60" y="570" width="352" height="52" rx="8" fill="#FFFFFF" stroke="#FAC775"/>
    <text x="236" y="590" text-anchor="middle" font-size="13" fill="#633806">IStateRepository 接口</text>
    <text x="236" y="608" text-anchor="middle" font-size="10" fill="#854F0B">load / save / clearAll / readBackup</text>
    <rect x="424" y="570" width="352" height="52" rx="8" fill="#FFFFFF" stroke="#FAC775"/>
    <text x="600" y="590" text-anchor="middle" font-size="13" fill="#633806">StateRepository（Preferences 实现）</text>
    <text x="600" y="608" text-anchor="middle" font-size="10" fill="#854F0B">唯一引用 @kit.ArkData · 损坏回落</text>
    <rect x="788" y="570" width="352" height="52" rx="8" fill="#FFFFFF" stroke="#FAC775"/>
    <text x="964" y="590" text-anchor="middle" font-size="13" fill="#633806">InMemoryStateRepository</text>
    <text x="964" y="608" text-anchor="middle" font-size="10" fill="#854F0B">测试替身 · Mock 输入不依赖设备</text>
  </g>

  <path d="M600 636 L600 659" stroke="#7A7A72" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="40" y="662" width="1120" height="96" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="60" y="690" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#444441">应用入口 M6 / 测试 M7 / 系统能力</text>
  <rect x="894" y="672" width="246" height="24" rx="6" fill="#B4782D"/>
  <text x="1017" y="689" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#FFFFFF">本层全部由本人负责</text>
  <g font-family="PingFang SC, sans-serif">
    <rect x="60" y="704" width="352" height="42" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
    <text x="236" y="722" text-anchor="middle" font-size="13" fill="#444441">EntryAbility 冷启动门禁 / 后台兜底</text>
    <text x="236" y="738" text-anchor="middle" font-size="10" fill="#B4782D">本人负责 · await restore 后渲染</text>
    <rect x="424" y="704" width="352" height="42" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
    <text x="600" y="722" text-anchor="middle" font-size="13" fill="#444441">12 条 Local Unit Test（@ohos/hypium）</text>
    <text x="600" y="738" text-anchor="middle" font-size="10" fill="#B4782D">本人负责 · 正常/边界/异常</text>
    <rect x="788" y="704" width="352" height="42" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
    <text x="964" y="722" text-anchor="middle" font-size="13" fill="#444441">@ohos.data.preferences 本地存储</text>
    <text x="964" y="738" text-anchor="middle" font-size="10" fill="#7A7A72">HarmonyOS 系统能力（调用方本人）</text>
  </g>

  <text x="40" y="792" font-family="PingFang SC, sans-serif" font-size="12" fill="#7A7A72">数据流：界面事件 → ViewModel → 纯逻辑引擎 → 新 GameState → await 落盘 → AppStorage 广播 → @State 整体重新赋值 → 页面重绘</text>
  <text x="40" y="814" font-family="PingFang SC, sans-serif" font-size="12" fill="#B4782D">图例：琥珀色标注 = 本人负责；蓝色 = 表示层；绿色 = 状态编排；紫色 = 纯逻辑（可被单测直接 import）；橙色 = 持久化；灰色 = 入口与测试</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7A7A72" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>
</svg>

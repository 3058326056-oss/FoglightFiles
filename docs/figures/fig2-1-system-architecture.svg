  <rect x="40" y="276" width="1120" height="92" rx="12" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="1"/>
  <text x="60" y="304" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#085041">状态编排层 M5 · SSOT 与事件通信</text>
  <rect x="894" y="286" width="246" height="24" rx="6" fill="#B4782D"/>
  <text x="1017" y="303" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#FFFFFF">本层全部由本人负责</text>
  <g font-family="PingFang SC, sans-serif">
    <rect x="60" y="316" width="352" height="40" rx="8" fill="#FFFFFF" stroke="#9FE1CB"/>
    <text x="236" y="333" text-anchor="middle" font-size="13" fill="#085041">CaseViewModel（唯一权威 GameState）</text>
    <text x="236" y="349" text-anchor="middle" font-size="10" fill="#B4782D">本人负责 · 串行落盘 / 冷启动恢复</text>
    <rect x="424" y="316" width="352" height="40" rx="8" fill="#FFFFFF" stroke="#9FE1CB"/>
    <text x="600" y="333" text-anchor="middle" font-size="13" fill="#085041">AppContext 模块级单例</text>
    <text x="600" y="349" text-anchor="middle" font-size="10" fill="#B4782D">本人负责 · 依赖装配</text>

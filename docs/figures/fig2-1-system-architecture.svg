    <text x="164" y="172" text-anchor="middle" font-size="10" fill="#B4782D">本人负责 · 加载态门禁</text>

    <rect x="278" y="134" width="208" height="46" rx="8" fill="#FFFFFF" stroke="#B5D4F4"/>
